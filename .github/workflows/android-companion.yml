name: Android USB Companion APK
on:
  push:
    branches:
      - feature/android-portable-companion
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: gradle -p android-companion :app:assembleDebug --stacktrace --no-daemon
      - name: Check APK archive and manifest
        run: |
          set -euo pipefail
          APK=android-companion/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 10
          sha256sum "$APK" | tee android-companion/app-debug.sha256
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: AXY-Portable-Android-v0.1-debug-apk
          path: |
            android-companion/app/build/outputs/apk/debug/app-debug.apk
            android-companion/app-debug.sha256
          retention-days: 14
          if-no-files-found: error
